<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Read Timer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #222;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 16px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .grid {
      display: grid;
      gap: 12px;
    }
    .grid-2 {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
    }
    .grid-3 {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, 1fr);
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="text"],
    input[type="number"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      border: 1px solid #cfd5dd;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      background: #fff;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      border: 1px solid #cfd5dd;
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #f3f4f6;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .muted {
      color: #666;
      font-size: 14px;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .output-box {
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
      padding: 14px;
      min-height: 120px;
    }
    .stat {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
    }
    .stat-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
    }
    .list {
      display: grid;
      gap: 8px;
    }
    .list-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fafafa;
    }
    .error {
      color: #b00020;
      font-weight: 600;
    }
    .success {
      color: #0a7a35;
      font-weight: 600;
    }
    .hidden {
      display: none !important;
    }
    #authArea {
      background: #fff8e1;
      border: 1px solid #f0d98c;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    @media (max-width: 720px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Read Timer</h1>
  </header>

  <main>
    <div id="authArea" class="hidden">
      <div class="muted">最初の1回だけ Basic 認証情報を入力してください。</div>
      <input id="basicUserInput" type="text" placeholder="Basic User" />
      <input id="basicPassInput" type="password" placeholder="Basic Pass" />
      <button id="saveAuthBtn">保存</button>
      <div id="authMsg" class="muted"></div>
    </div>

    <section class="card">
      <h2>本文登録</h2>
      <div class="grid">
        <div>
          <label for="fullContent">本文</label>
          <textarea id="fullContent" placeholder="本文を入力"></textarea>
        </div>
    
        <div class="row">
          <button id="createFullBtn">本文を登録</button>
        </div>
    
        <div id="createFullMsg" class="muted"></div>
      </div>
    </section>

    <section class="card">
      <h2>抜粋登録</h2>
      <div class="grid">
        <div>
          <label for="excerptSourceTextId">抜粋元本文ID</label>
          <input id="excerptSourceTextId" type="number" placeholder="例: 1" />
        </div>
    
        <div>
          <label for="excerptContent">抜粋内容</label>
          <textarea id="excerptContent" placeholder="抜粋を入力"></textarea>
        </div>
    
        <div class="row">
          <button id="createExcerptBtn">抜粋を登録</button>
        </div>
    
        <div id="createExcerptMsg" class="muted"></div>
      </div>
    </section>
    
    <section class="card">
      <h2>ランダム表示</h2>
      <div class="grid">
        <div class="row">
          <button data-random-kind="full">本文ランダム</button>
          <button data-random-kind="excerpt">抜粋ランダム</button>
          <button data-random-kind="all">全文/抜粋ランダム</button>
        </div>

        <div class="grid">
          <div class="stat">
            <div class="stat-title">計測状態</div>
            <div id="readingState" class="stat-value" style="font-size:18px;">未開始</div>
          </div>
        </div>

        <div>
          <label>文章</label>
          <div id="displayContent" class="output-box"></div>
        </div>

        <div class="row">
          <button id="doneBtn" disabled>文章読解完了</button>
        </div>

        <div id="readingMsg" class="muted"></div>
      </div>
    </section>

    <section class="card">
      <h2>統計</h2>
      <div class="grid-3">
        <div class="stat">
          <div class="stat-title">今回の時間</div>
          <div id="currentElapsed" class="stat-value">-</div>
        </div>
        <div class="stat">
          <div class="stat-title">最小時間</div>
          <div id="minElapsed" class="stat-value">-</div>
        </div>
        <div class="stat">
          <div class="stat-title">直近件数</div>
          <div id="recentCount" class="stat-value">0</div>
        </div>
      </div>

      <div style="margin-top:12px;">
        <label>直近3回</label>
        <div id="recent3List" class="list"></div>
      </div>
    </section>

    <section class="card">
      <h2>登録済み文章一覧</h2>
      <div class="grid">
        <div class="row">
          <button data-list-kind="all">全部</button>
          <button data-list-kind="full">本文</button>
          <button data-list-kind="excerpt">抜粋</button>
        </div>
        <div id="textsList" class="list"></div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = "https://memo-save-api.jetkitayan.workers.dev";
    const BASIC_USER_KEY = "read_timer_basic_user";
    const BASIC_PASS_KEY = "read_timer_basic_pass";

    let BASIC_USER = localStorage.getItem(BASIC_USER_KEY) || "";
    let BASIC_PASS = localStorage.getItem(BASIC_PASS_KEY) || "";

    const authArea = document.getElementById("authArea");
    const userInput = document.getElementById("basicUserInput");
    const passInput = document.getElementById("basicPassInput");
    const saveAuthBtn = document.getElementById("saveAuthBtn");
    const authMsg = document.getElementById("authMsg");

    const el = {
      fullContent: document.getElementById("fullContent"),
      createFullBtn: document.getElementById("createFullBtn"),
      createFullMsg: document.getElementById("createFullMsg"),
    
      excerptSourceTextId: document.getElementById("excerptSourceTextId"),
      excerptContent: document.getElementById("excerptContent"),
      createExcerptBtn: document.getElementById("createExcerptBtn"),
      createExcerptMsg: document.getElementById("createExcerptMsg"),
    
      loadTextsBtn: document.getElementById("loadTextsBtn"),
      loadStatsBtn: document.getElementById("loadStatsBtn"),
    
      readingState: document.getElementById("readingState"),
      displayContent: document.getElementById("displayContent"),
      doneBtn: document.getElementById("doneBtn"),
      readingMsg: document.getElementById("readingMsg"),
    
      currentElapsed: document.getElementById("currentElapsed"),
      minElapsed: document.getElementById("minElapsed"),
      recentCount: document.getElementById("recentCount"),
      recent3List: document.getElementById("recent3List"),
    
      textsList: document.getElementById("textsList"),
    };
        
    const state = {
      currentText: null,
      startedAt: null,
      currentListKind: "all",
    };

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatMs(ms) {
      if (ms === null || ms === undefined || ms === "") return "-";
      const sec = Number(ms) / 1000;
      if (!Number.isFinite(sec)) return "-";
      return sec.toFixed(2) + " 秒";
    }

    async function createFullText() {
      el.createFullMsg.textContent = "";
      el.createFullMsg.className = "muted";
    
      try {
        const content = el.fullContent.value.trim();
        if (!content) {
          throw new Error("本文を入力してください");
        }
    
        const data = await apiFetch("/api/read-timer/texts", {
          method: "POST",
          body: JSON.stringify({
            kind: "full",
            content,
            source_text_id: null,
          }),
        });
    
        el.createFullMsg.textContent = `本文を登録しました。ID: ${data.text?.id ?? "-"}`;
        el.createFullMsg.className = "success";
        el.fullContent.value = "";
    
        await loadTexts(state.currentListKind);
      } catch (err) {
        el.createFullMsg.textContent = "登録失敗: " + err.message;
        el.createFullMsg.className = "error";
      }
    }

    async function createExcerptText() {
      el.createExcerptMsg.textContent = "";
      el.createExcerptMsg.className = "muted";
    
      try {
        const sourceTextId = Number(el.excerptSourceTextId.value);
        const content = el.excerptContent.value.trim();
    
        if (!Number.isFinite(sourceTextId)) {
          throw new Error("抜粋元本文IDを入力してください");
        }
        if (!content) {
          throw new Error("抜粋内容を入力してください");
        }
    
        const data = await apiFetch("/api/read-timer/texts", {
          method: "POST",
          body: JSON.stringify({
            kind: "excerpt",
            content,
            source_text_id: sourceTextId,
          }),
        });
    
        el.createExcerptMsg.textContent = `抜粋を登録しました。ID: ${data.text?.id ?? "-"}`;
        el.createExcerptMsg.className = "success";
        el.excerptSourceTextId.value = "";
        el.excerptContent.value = "";
    
        await loadTexts(state.currentListKind);
      } catch (err) {
        el.createExcerptMsg.textContent = "登録失敗: " + err.message;
        el.createExcerptMsg.className = "error";
      }
    }
    
    function formatDateTime(s) {
      if (!s) return "-";
      const d = new Date(s);
      if (isNaN(d.getTime())) return String(s);
      return d.toLocaleString("ja-JP");
    }

    function getConfig() {
      return {
        apiBase: API_BASE,
        basicUser: BASIC_USER,
        basicPass: BASIC_PASS,
      };
    }

    function authHeader() {
      const { basicUser, basicPass } = getConfig();
      return "Basic " + btoa(`${basicUser}:${basicPass}`);
    }

    async function apiFetch(path, options = {}) {
      const { apiBase, basicUser, basicPass } = getConfig();

      if (!apiBase) {
        throw new Error("API Base URL が未設定です");
      }
      if (!basicUser || !basicPass) {
        throw new Error("Basic認証情報を保存してください");
      }

      const headers = {
        "Content-Type": "application/json",
        "Authorization": authHeader(),
        ...(options.headers || {}),
      };

      const res = await fetch(apiBase + path, {
        ...options,
        headers,
      });

      let data = null;
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) {
        data = await res.json();
      } else {
        const text = await res.text();
        data = { raw: text };
      }

      if (!res.ok) {
        const msg = data?.error || data?.detail || `HTTP ${res.status}`;
        throw new Error(msg);
      }

      if (data && data.ok === false && data.error) {
        throw new Error(data.error);
      }

      return data;
    }

    function resetCurrentDisplay() {
      state.currentText = null;
      state.startedAt = null;
      el.displayContent.textContent = "";
      el.readingState.textContent = "未開始";
      el.doneBtn.disabled = true;
    }
    
    async function randomText(kind) {
      el.readingMsg.textContent = "";
      el.readingMsg.className = "muted";

      try {
        const data = await apiFetch(`/api/read-timer/texts/random?kind=${encodeURIComponent(kind)}`);
        const item = data.text;

        state.currentText = item;
        state.startedAt = new Date().toISOString();
        
        el.displayContent.textContent = item?.content || "";
        el.readingState.textContent = "計測中";
        el.doneBtn.disabled = false;
        el.readingMsg.textContent = "文章を表示しました。読解完了で記録します。";

        await loadStats();
      } catch (err) {
        resetCurrentDisplay();
        el.readingMsg.textContent = "ランダム取得失敗: " + err.message;
        el.readingMsg.className = "error";
      }
    }

    async function finishReading() {
      if (!state.currentText || !state.startedAt) {
        el.readingMsg.textContent = "先にランダム表示してください。";
        el.readingMsg.className = "error";
        return;
      }

      try {
        const finishedAt = new Date().toISOString();

        const data = await apiFetch("/api/read-timer/logs", {
          method: "POST",
          body: JSON.stringify({
            text_id: state.currentText.id,
            started_at: state.startedAt,
            finished_at: finishedAt,
          }),
        });

        const elapsedMs = data.log?.elapsed_ms ?? null;
        el.currentElapsed.textContent = formatMs(elapsedMs);
        el.readingState.textContent = "完了";
        el.doneBtn.disabled = true;
        el.readingMsg.textContent = "読解時間を保存しました。";
        el.readingMsg.className = "success";

        state.startedAt = null;

        await loadStats();
      } catch (err) {
        el.readingMsg.textContent = "保存失敗: " + err.message;
        el.readingMsg.className = "error";
      }
    }

    async function loadStats() {
      if (!state.currentText?.id) {
        el.minElapsed.textContent = "-";
        el.recentCount.textContent = "0";
        el.recent3List.innerHTML = `<div class="muted">先にランダム表示してください。</div>`;
        return;
      }
    
      try {
        const path = `/api/read-timer/stats?text_id=${encodeURIComponent(state.currentText.id)}`;
        const data = await apiFetch(path);
    
        el.minElapsed.textContent = formatMs(data.min_elapsed_ms);
        const recent3 = Array.isArray(data.recent3) ? data.recent3 : [];
        el.recentCount.textContent = String(recent3.length);
    
        if (recent3.length === 0) {
          el.recent3List.innerHTML = `<div class="muted">まだ記録がありません。</div>`;
          return;
        }
    
        el.recent3List.innerHTML = recent3.map(item => {
          return `
            <div class="list-item">
              <div><strong>時間:</strong> ${escapeHtml(formatMs(item.elapsed_ms))}</div>
              <div><strong>保存日時:</strong> ${escapeHtml(formatDateTime(item.created_at))}</div>
            </div>
          `;
        }).join("");
      } catch (err) {
        el.recent3List.innerHTML = `<div class="error">統計取得失敗: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadTexts(kind = "all") {
      state.currentListKind = kind;
      el.textsList.innerHTML = `<div class="muted">読み込み中...</div>`;
    
      try {
        const data = await apiFetch(`/api/read-timer/texts?kind=${encodeURIComponent(kind)}&limit=100`);
        const texts = Array.isArray(data.texts) ? data.texts : [];
    
        if (texts.length === 0) {
          el.textsList.innerHTML = `<div class="muted">データがありません。</div>`;
          return;
        }
    
        el.textsList.innerHTML = texts.map(item => `
          <div class="list-item">
            <div>${escapeHtml(item.content || "")}</div>
            <div class="muted" style="margin-top:6px;">
              作成: ${escapeHtml(formatDateTime(item.created_at))}<br>
              更新: ${escapeHtml(formatDateTime(item.updated_at))}
            </div>
            <div class="row" style="margin-top:10px;">
              <button class="delete-text-btn" data-id="${item.id}">削除</button>
            </div>
          </div>
        `).join("");
    
        document.querySelectorAll(".delete-text-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.id;
            if (!confirm("この文章を削除しますか？")) return;
    
            try {
              await apiFetch(`/api/read-timer/texts/${encodeURIComponent(id)}`, {
                method: "DELETE",
              });
    
              if (state.currentText?.id && String(state.currentText.id) === String(id)) {
                resetCurrentDisplay();
                el.currentElapsed.textContent = "-";
                el.minElapsed.textContent = "-";
                el.recentCount.textContent = "0";
                el.recent3List.innerHTML = `<div class="muted">まだ記録がありません。</div>`;
              }
    
              await loadTexts(state.currentListKind);
            } catch (err) {
              alert("削除失敗: " + err.message);
            }
          });
        });
    
      } catch (err) {
        el.textsList.innerHTML = `<div class="error">一覧取得失敗: ${escapeHtml(err.message)}</div>`;
      }
    }
    function bindEvents() {
      el.createFullBtn.addEventListener("click", createFullText);
      el.createExcerptBtn.addEventListener("click", createExcerptText);
      el.doneBtn.addEventListener("click", finishReading);
      el.loadStatsBtn.addEventListener("click", loadStats);
      el.loadTextsBtn.addEventListener("click", () => loadTexts(state.currentListKind));

      document.querySelectorAll("[data-random-kind]").forEach(btn => {
        btn.addEventListener("click", () => randomText(btn.dataset.randomKind));
      });

      document.querySelectorAll("[data-list-kind]").forEach(btn => {
        btn.addEventListener("click", () => loadTexts(btn.dataset.listKind));
      });

      saveAuthBtn.addEventListener("click", async () => {
        const user = userInput.value.trim();
        const pass = passInput.value.trim();

        if (!user || !pass) {
          authMsg.textContent = "ユーザー名とパスワードを入力してください。";
          authMsg.className = "error";
          return;
        }

        BASIC_USER = user;
        BASIC_PASS = pass;
        localStorage.setItem(BASIC_USER_KEY, BASIC_USER);
        localStorage.setItem(BASIC_PASS_KEY, BASIC_PASS);

        authArea.classList.add("hidden");
        authMsg.textContent = "";
        await loadStats();
        await loadTexts("all");
      });
    }

    async function init() {
      bindEvents();
      updateKindUI();
      resetCurrentDisplay();

      if (!BASIC_USER || !BASIC_PASS) {
        authArea.classList.remove("hidden");
        return;
      }

      authArea.classList.add("hidden");
      await loadStats();
      await loadTexts("all");
    }

    init();
  </script>
</body>
</html>
